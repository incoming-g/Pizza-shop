<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог товарів - PizzaLite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <!-- Навігація -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top" id="mainNavbar">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <img src="img/favicon.svg" alt="PizzaLite" width="36" height="36" style="margin-right:8px"> PizzaLite
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Головна</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="products.html">Каталог</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="cart.html">
                            <i class="bi bi-cart3"></i> Кошик
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Фільтри (ліворуч) і каталог (праворуч) -->
    <section class="py-5">
        <div class="container">
            <h2 class="mb-4">Каталог товарів</h2>

            <div class="row">
                <!-- Контент: товари (широкий макет — боковая панель удалена) -->
                <main class="col-12">
                    <!-- Короткий рядок статусу / кількість / додаткове сортування (опціонально) -->
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div id="results-info" class="text-muted">Показано всі товари</div>
                        <!-- Місце для швидкого сортування (якщо хочете дублювати) -->
                        <!-- <div>
                            <select class="form-select form-select-sm" id="quick-sort">
                                <option value="default">За замовчуванням</option>
                            </select>
                        </div> -->
                    </div>

                    <!-- Список товарів -->
                    <div class="row g-4" id="products-list">
                        <!-- Товари будуть додані через JavaScript -->
                    </div>
                </main>
            </div>
        </div>
    </section>

    <!-- Футер -->
    <footer class="bg-dark text-white text-center py-3 mt-5">
        <div class="container">
            <p class="mb-0">&copy; 2024 PizzaLite. Всі права захищені.</p>
        </div>
    </footer>

    <!-- Скріпти -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/cart.js"></script>
    <script src="scripts/products.js"></script>

    <script>
        // Якщо ваш products.js навчається на існуючих id полів:
        // переконайтеся, що products.js підписується на #category-filter, #sort-filter, #search-input, #in-stock-check, #price-min, #price-max, #apply-filters
        // Приклад простого підключення подій (як шаблон):
        document.getElementById('apply-filters')?.addEventListener('click', () => {
            // викличте вашу функцію оновлення списку товарів або тригерів фільтрації
            // window.updateProducts?.()  // якщо така функція є в products.js
        });
    </script>
</body>
</html>
