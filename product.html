<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Товар - PizzaLite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <!-- Навігація -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top" id="mainNavbar">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <img src="img/favicon.svg" alt="PizzaLite" width="36" height="36" style="margin-right:8px"> PizzaLite
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Головна</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="products.html">Каталог</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="cart.html">
                            <i class="bi bi-cart3"></i> Кошик
                            <span class="badge bg-danger" id="cart-count">0</span>
                        </a>
                    </li>
                    <li class="nav-item d-flex align-items-center">
                        <button class="btn btn-outline-light btn-sm nav-login nav-auth-btn">Увійти</button>
                    </li>
                    <li class="nav-item d-flex align-items-center">
                        <button class="btn btn-light btn-sm nav-register nav-auth-btn">Реєстрація</button>
                    </li>
                    <li class="nav-item d-flex align-items-center nav-user" style="display:none">
                        <div class="user-badge">
                            <img src="img/favicon.svg" alt="user">
                            <span class="user-name">Guest</span>
                            <button class="btn btn-sm btn-outline-light ms-2 nav-logout">Вийти</button>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Деталі товару -->
    <section class="py-5">
        <div class="container">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="index.html">Головна</a></li>
                    <li class="breadcrumb-item"><a href="products.html">Каталог</a></li>
                    <li class="breadcrumb-item active" id="breadcrumb-title">Товар</li>
                </ol>
            </nav>

            <div class="row" id="product-details">
                <!-- Деталі товару будуть додані через JavaScript -->
            </div>
        </div>
    </section>

    <!-- Футер -->
    <footer class="bg-dark text-white text-center py-3 mt-5">
        <div class="container">
            <p class="mb-0">&copy; 2025 PizzaLite. Всі права захищені.</p>
        </div>
    </footer>

        <!-- Login Modal -->
        <div class="modal fade auth-modal" id="loginModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Вхід в PizzaLite</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="login-form">
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input id="login-email" class="form-control" type="email" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Пароль</label>
                                <input id="login-pass" class="form-control" type="password" required>
                            </div>
                            <div class="d-flex justify-content-end">
                                <button class="btn btn-secondary me-2" type="button" data-bs-dismiss="modal">Скасувати</button>
                                <button class="btn btn-primary" type="submit">Увійти</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Register Modal -->
        <div class="modal fade auth-modal" id="registerModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Реєстрація в PizzaLite</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="register-form">
                            <div class="mb-3">
                                <label class="form-label">Ім'я</label>
                                <input id="reg-name" class="form-control" type="text" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input id="reg-email" class="form-control" type="email" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Пароль</label>
                                <input id="reg-pass" class="form-control" type="password" required>
                            </div>
                            <div class="d-flex justify-content-end">
                                <button class="btn btn-secondary me-2" type="button" data-bs-dismiss="modal">Скасувати</button>
                                <button class="btn btn-primary" type="submit">Зареєструватись</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/cart.js"></script>
    <script src="scripts/product.js"></script>
    <script src="scripts/auth.js"></script>
</body>
</html>
